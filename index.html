<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск картинок Pinterest</title>
    <style>
        body { background: #f0f0f0; font-family: Arial, sans-serif; font-size: 16px; max-width: 500px; margin: 30px auto; padding: 10px; }
        input, button { font-size: 18px; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; border-radius: 6px; border: 1px solid #aaa; }
        button { background: #e60023; color: white; border: none; }
        small { color: #888; }
    </style>
</head>
<body>
    <h2>📌 Pinterest Lite</h2>
    <p>Введите запрос — откроется Google Images с картинками с Pinterest.</p>
    <form action="https://www.google.com/search" method="GET" target="_blank">
        <input type="hidden" name="tbm" value="isch">
        <input type="text" name="q" placeholder="например: кот" required value="site:pinterest.com ">
        <button type="submit">🔍 Искать через Google</button>
    </form>
    <small>Все картинки сжаты Google, работают на любом телефоне.</small>
</body>
</html>
